name: Publish binary cache

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: haskell-agent-binary-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: '["self-hosted", "haskell-agent", "office-builder", "x86_64-linux"]'
            install-nix: false
          - system: aarch64-darwin
            runner: '"macos-15"'
            install-nix: true
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
      ATTIC_FLAKE: github:zhaofengli/attic/7a19204df10d606c5070e6bb72615c3461900c05#attic
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Install Nix on the ephemeral macOS runner
        if: matrix.install-nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          extra-conf: |
            sandbox = true

      - name: Build install closure
        id: build
        shell: bash
        run: |
          set -euo pipefail

          nix_bin="$(command -v nix || true)"
          if [[ -z "$nix_bin" && -x /run/current-system/sw/bin/nix ]]; then
            nix_bin=/run/current-system/sw/bin/nix
          fi
          if [[ -z "$nix_bin" ]]; then
            echo "::error title=Missing Nix binary::nix is required to build haskell-agent"
            exit 1
          fi

          out_path=$(
            "$nix_bin" build .#default \
              --accept-flake-config \
              --no-link \
              --print-out-paths
          )
          printf 'out-path=%s\n' "$out_path" >> "$GITHUB_OUTPUT"

      - name: Push install closure to the public IHP cache
        shell: bash
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          OUT_PATH: ${{ steps.build.outputs.out-path }}
        run: |
          set -euo pipefail

          nix_bin="$(command -v nix || true)"
          if [[ -z "$nix_bin" && -x /run/current-system/sw/bin/nix ]]; then
            nix_bin=/run/current-system/sw/bin/nix
          fi
          if [[ -z "$nix_bin" ]]; then
            echo "::error title=Missing Nix binary::nix is required to run the pinned Attic client"
            exit 1
          fi
          if [[ -z "$ATTIC_TOKEN" ]]; then
            echo "::error title=Missing Attic token::configure the ATTIC_TOKEN repository secret"
            exit 1
          fi

          export HOME="$RUNNER_TEMP/attic-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME"
          chmod 700 "$HOME" "$XDG_CONFIG_HOME"
          trap 'rm -rf "$HOME"' EXIT

          "$nix_bin" run "$ATTIC_FLAKE" -- login di \
            https://cache.digitallyinduced.com \
            "$ATTIC_TOKEN"
          "$nix_bin" run "$ATTIC_FLAKE" -- push --jobs 4 di:public "$OUT_PATH"
