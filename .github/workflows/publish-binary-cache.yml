name: Publish binary cache

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: haskell-agent-binary-cache-${{ github.ref }}
  # Keep the current publication alive when another commit lands on master.
  # GitHub still coalesces later pending runs within this concurrency group.
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: '["self-hosted", "haskell-agent", "office-builder", "x86_64-linux"]'
            trusted-rebuild: false
            build-cores: 1
          - system: aarch64-darwin
            runner: '["self-hosted", "haskell-agent", "ihp-ci-mac", "aarch64-darwin"]'
            trusted-rebuild: true
            build-cores: 1
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
      ATTIC_PACKAGE: github:NixOS/nixpkgs/afe3d8ac4395617bdcdac9f188ac8717a062e014#attic-client
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Build install and run closures
        shell: bash
        env:
          SYSTEM: ${{ matrix.system }}
          TRUSTED_REBUILD: ${{ matrix.trusted-rebuild }}
          BUILD_CORES: ${{ matrix.build-cores }}
        run: |
          set -euo pipefail

          nix_bin="$(command -v nix || true)"
          if [[ -z "$nix_bin" && -x /run/current-system/sw/bin/nix ]]; then
            nix_bin=/run/current-system/sw/bin/nix
          fi
          if [[ -z "$nix_bin" ]]; then
            echo "::error title=Missing Nix binary::nix is required to build haskell-agent"
            exit 1
          fi

          build_args=(
            # `nix profile add` installs packages.default, while `nix run`
            # executes apps.default, backed by packages.agent-cli. They are
            # different outputs on Linux, so publish both closures.
            build .#default .#agent-cli
            --no-link
            --print-out-paths
            --max-jobs 1
            --cores "$BUILD_CORES"
          )
          if [[ "$TRUSTED_REBUILD" == true ]]; then
            # Never restore the Darwin output from the cache previously populated
            # by the affected Mac. Dependencies still come from cache.nixos.org.
            build_args+=(
              --option accept-flake-config false
              --option substituters https://cache.nixos.org/
              --option extra-substituters ""
            )
          else
            build_args+=(--accept-flake-config)
          fi

          out_paths_file="$RUNNER_TEMP/haskell-agent-cache-out-paths"
          "$nix_bin" "${build_args[@]}" > "$out_paths_file"
          if [[ ! -s "$out_paths_file" ]]; then
            echo "::error title=Missing build outputs::Nix did not report any store paths"
            exit 1
          fi

          # Keep this assertion next to the CI targets so a future app/package
          # remapping cannot silently leave `nix run` uncached again.
          app_program=$(
            "$nix_bin" eval \
              --option accept-flake-config false \
              --raw ".#apps.$SYSTEM.default.program"
          )
          run_out=$(
            "$nix_bin" eval \
              --option accept-flake-config false \
              --raw ".#packages.$SYSTEM.agent-cli.outPath"
          )
          if [[ "$app_program" != "$run_out/"* ]]; then
            echo "::error title=Default app is not cached::apps.default no longer uses packages.agent-cli"
            exit 1
          fi
          if ! grep -Fqx -- "$run_out" "$out_paths_file"; then
            echo "::error title=Default app is not cached::the packages.agent-cli output was not built"
            exit 1
          fi

      - name: Push install and run closures to the public Attic cache
        shell: bash
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail

          nix_bin="$(command -v nix || true)"
          if [[ -z "$nix_bin" && -x /run/current-system/sw/bin/nix ]]; then
            nix_bin=/run/current-system/sw/bin/nix
          fi
          if [[ -z "$nix_bin" ]]; then
            echo "::error title=Missing Nix binary::nix is required to run the pinned Attic client"
            exit 1
          fi
          if [[ -z "$ATTIC_TOKEN" ]]; then
            echo "::error title=Missing Attic token::configure the ATTIC_TOKEN repository secret"
            exit 1
          fi

          export HOME="$RUNNER_TEMP/attic-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME"
          chmod 700 "$HOME" "$XDG_CONFIG_HOME"
          trap 'rm -rf "$HOME"' EXIT

          "$nix_bin" run "$ATTIC_PACKAGE" -- login di \
            https://cache.digitallyinduced.com \
            "$ATTIC_TOKEN"

          "$nix_bin" run "$ATTIC_PACKAGE" -- \
            push --jobs 4 --stdin di:public \
            < "$RUNNER_TEMP/haskell-agent-cache-out-paths"
